name: Release

# Triggers a distinct release for a single package:
# 1. Bumps the package version in deno.json
# 2. Prepends a CHANGELOG entry
# 3. Commits, tags (media-devices/vX.Y.Z), and pushes
# 4. The Publish workflow picks up the tag and publishes to JSR
#
# Usage: Actions -> Release -> Run workflow -> select package -> version bump type

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to release"
        required: true
        type: choice
        options:
          - av-nodes
          - media-log
          - media-devices
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      message:
        description: "Short description for the changelog entry"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Determine package directory
        id: pkg
        run: |
          case "${{ inputs.package }}" in
            av-nodes) dir="packages/av_nodes" ;;
            media-log) dir="packages/media_log" ;;
            media-devices) dir="packages/media_devices" ;;
            *) echo "::error::Unknown package"; exit 1 ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Bump version
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          current=$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('deno.json')).version)")
          IFS='.' read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          new_version="$major.$minor.$patch"
          deno eval "
            const cfg = JSON.parse(Deno.readTextFileSync('deno.json'));
            cfg.version = '$new_version';
            Deno.writeTextFileSync('deno.json', JSON.stringify(cfg, null, 2) + '\n');
          "
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          new_version="${{ steps.bump.outputs.new_version }}"
          message="${{ inputs.message }}"
          date=$(date -u +%Y-%m-%d)
          if [ ! -f CHANGELOG.md ]; then
            printf '# Changelog

All notable changes are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
' > CHANGELOG.md
          fi
          python3 -c "
          import re
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()
          entry = f'## [{new_version}] - {date}

- {message}

'
          match = re.search(r'
## \[', content)
          if match:
              content = content[:match.start()] + '
' + entry + content[match.start()+1:]
          else:
              content = content + '
' + entry
          with open('CHANGELOG.md', 'w') as f:
              f.write(content)
          "

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.pkg.outputs.dir }}/deno.json" "${{ steps.pkg.outputs.dir }}/CHANGELOG.md"
          git commit -m "chore(${{ inputs.package }}): release v${{ steps.bump.outputs.new_version }}"
          git tag "${{ inputs.package }}/v${{ steps.bump.outputs.new_version }}"
          git push origin main --tags
